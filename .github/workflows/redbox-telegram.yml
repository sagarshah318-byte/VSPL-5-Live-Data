name: Redbox X to Telegram

on:
  schedule:
    # 08:00 through 23:00 India time (UTC+5:30), every hour
    - cron: "30 2-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbox-telegram
  cancel-in-progress: false

jobs:
  forward-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Redbox posts and send to Telegram
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redbox-bot/bot.py

      - name: Save delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redbox-bot/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Redbox delivery state"
            git push
          fi
